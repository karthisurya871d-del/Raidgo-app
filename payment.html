<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideGo - Payment</title>

    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#FFD400;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h2{
    margin-bottom:20px;
}

h3{
    color:green;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid gray;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    background:black;
    color:#FFD400;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#333;
}</style>
</head>
<body>

<div class="container">

    <h2>Payment</h2>

    <h3 id="fareAmount"></h3>

    <label>Select Payment Method</label>

    <select id="paymentMethod">
        <option value="">Choose Payment Method</option>
        <option>UPI</option>
        <option>Credit Card</option>
        <option>Debit Card</option>
        <option>Cash</option>
    </select>

    <button onclick="payNow()">Pay Now</button>

</div>

<script src="javascript.js"></script>

</body>
</html>
