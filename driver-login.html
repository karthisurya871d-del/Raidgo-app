<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideGo - Driver Partner Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #FFD400, #FFC107);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .driver-badge {
            display: inline-block;
            background: #111;
            color: #FFD400;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        h2 {
            color: #222;
            margin-bottom: 10px;
            font-size: 26px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #FFD400;
            box-shadow: 0 0 8px rgba(255,212,0,0.5);
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: #FFD400;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #FFD400;
            color: #111;
        }
        .links-area {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.8;
        }
        a {
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .footer-note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="driver-badge">👨‍✈️ DRIVER PORTAL</div>
    <h2>Driver Partner Login</h2>
    <p class="subtitle">Access your assigned trips & earnings</p>

    <form onsubmit="driverLogin(event)">
        <input type="email" id="driverEmail" placeholder="Driver Email Address" required>
        <input type="password" id="driverPassword" placeholder="Enter Password" required>
        <button type="submit">Login to Dashboard</button>
    </form>

    <div class="links-area">
        <p>
            New Driver Partner?
            <a href="/driver-register">Register as Driver</a>
        </p>
        <p>
            Are you a customer?
            <a href="/login">Customer Login</a>
        </p>
        <p>
            <a href="/" style="color:#555;">← Back to Home</a>
        </p>
    </div>

    <div class="footer-note">
        RideGo Driver Partner Platform &bull; Educational Project
    </div>

</div>

<script src="javascript.js"></script>

</body>
</html>
