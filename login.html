<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RideGo Login</title>
    <style>/* Login Page Style */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    background:linear-gradient(135deg,#FFD400,#FFC107);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    width:360px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

.container h2{
    color:#222;
    margin-bottom:25px;
    font-size:30px;
}

.container input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
    transition:0.3s;
}

.container input:focus{
    border-color:#FFD400;
    box-shadow:0 0 8px rgba(255,212,0,0.5);
}

.container button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#111;
    color:#FFD400;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.container button:hover{
    background:#FFD400;
    color:#111;
}

.container p{
    margin-top:20px;
    font-size:15px;
}

.container a{
    text-decoration:none;
    color:#0066cc;
    font-weight:bold;
}

.container a:hover{
    text-decoration:underline;
}</style>
</head>
<body>

<div class="container">

    <h2>RideGo Login</h2>

    <input type="email" id="email" placeholder="Enter Email">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

    <p style="font-size: 12px; color: #888; margin-top: 15px;">
        RideGo Demo &bull; Educational Project
    </p>

</div>

<script src="javascript.js"></script>

</body>
</html>
