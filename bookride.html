<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideGo - Book Ride</title>

    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#FFD400;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h2{
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:black;
    color:#FFD400;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#333;
}

#fare{
    margin-top:20px;
    color:green;
}</style>
</head>
<body>

<div class="container">

    <h2>Book Your Ride</h2>

    <input type="text" id="pickup" placeholder="Enter Pickup Location">

    <input type="text" id="drop" placeholder="Enter Drop Location">

    <select id="vehicle">
        <option value="">Select Vehicle</option>
        <option value="Bike">Bike</option>
        <option value="Auto">Auto</option>
        <option value="Car">Car</option>
    </select>

    <button onclick="calculateFare()">Check Fare</button>

    <h3 id="fare"></h3>

    <button onclick="bookRide()">Book Ride</button>

</div>

<script src="javascript.js"></script>

</body>
</html>
