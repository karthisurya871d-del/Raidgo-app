# Netlify Configuration for RideGo

[build]
  publish = "."

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CRITICAL SECURITY: Block all public access to sensitive JSON and server files on Netlify
[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

# Clean URL Rewrites for Frontend Pages
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/bookride"
  to = "/bookride.html"
  status = 200

[[redirects]]
  from = "/paymentpage"
  to = "/payment.html"
  status = 200

[[redirects]]
  from = "/feedbackpage"
  to = "/feedback.html"
  status = 200

[[redirects]]
  from = "/mybookings"
  to = "/mybookings.html"
  status = 200

[[redirects]]
  from = "/ridestatus"
  to = "/ridestatus.html"
  status = 200

[[redirects]]
  from = "/driver"
  to = "/driver.html"
  status = 200

